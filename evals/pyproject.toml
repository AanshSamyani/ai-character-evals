[project]
name = "surveil-eval"
version = "0.1.0"
description = "Mass-surveillance propensity eval (harmful + matched benign arms)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.270",
    "openai>=3.19.2",
]

[tool.uv.build-backend]
module-name = "surveil"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
